<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hifz - Quran Memorization Tracker</title>
<meta name="description" content="Hifz tracks what you memorized from the Quran and schedules your revisions with spaced repetition. Arabic and English, works offline, your data stays in your browser.">
<meta name="theme-color" content="#0b1f18">
<meta property="og:type" content="website">
<meta property="og:title" content="Hifz - Quran Memorization Tracker">
<meta property="og:description" content="Log what you memorized, get a spaced-revision schedule. Arabic & English, private, offline-first.">
<meta property="og:url" content="https://yousefkhames.github.io/hifz/">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <img class="logo-mark" src="assets/logo.svg" alt="Hifz logo" width="44" height="44">
    <div class="titles">
      <h1 data-i18n="app_name">Hifz</h1>
      <div class="tagline" data-i18n="tagline">Memorize. Revise. Never forget.</div>
    </div>
    <button class="lang-toggle" id="langToggle" type="button">العربية</button>
  </header>

  <main id="view" aria-live="polite"></main>

  <div class="footer-note">
    <span class="bismi" data-i18n="footer_line">المراجعة أمّ الحفظ</span>
    <span data-i18n="footer_note">Your data never leaves this browser.</span>
  </div>
</div>

<div id="toast" role="status"></div>

<nav class="bottom" aria-label="Main">
  <div class="bar">
    <button class="nav-btn on" data-route="#/" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span data-i18n="nav_today">Today</span>
    </button>
    <button class="nav-btn" data-route="#/add" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span data-i18n="nav_add">Add</span>
    </button>
    <button class="nav-btn" data-route="#/library" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
      <span data-i18n="nav_library">Library</span>
    </button>
    <button class="nav-btn" data-route="#/progress" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span data-i18n="nav_progress">Progress</span>
    </button>
    <button class="nav-btn" data-route="#/settings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="nav_settings">Settings</span>
    </button>
  </div>
</nav>

<script src="data.js"></script>
<script src="scheduler.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
<div class="yk-credit" style="text-align:center;padding:14px 12px 24px;font:13px/1.5 system-ui,sans-serif;opacity:.85"><img src="assets/yk-logo.svg" width="20" height="20" alt="" style="vertical-align:middle;margin-inline-end:6px"><span>By Yousef Khames · من تطوير يوسف خميس</span><br><small>Demo / portfolio project · مشروع تجريبي للعرض</small></div>
</body>
</html>
